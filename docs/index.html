<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="main">
      <div class="image-container">
        <img
          class="bg"
          src="./images/bg.jpg"
          alt="Фоновая картинка iintoo invest together"
        />
        <img
          class="logo"
          src="./images/logo.svg"
          alt="Логотип iintoo invest together"
        />
      </div>
      <div class="content">
        <h2>Get iintoo it today</h2>
        <h3>There is no charge or obligation upon registration.</h3>
        <div class="buttons">
          <button class="facebook">
            Register with Facebook
            <img
              class="svg-fb"
              src="./images/facebook.svg"
              alt="Facebook logo"
            />
          </button>
          <button class="linkedin">
            Register with LinkedIn
            <img
              class="svg-ln"
              src="./images/linkedin.svg"
              alt="LinkedIn logo"
            />
          </button>
        </div>
        <div class="or">
          <span>OR</span>
        </div>
        <div class="inputs">
          <div class="first-input">
            <label class="form-label" for="email">Email</label>
            <input id="email" type="email" value="gus.goodwin@gmail.com" />
          </div>
          <div class="second-input">
            <label class="form-label" for="phone">Phone</label>
            <input id="phone" type="tel" />
          </div>
        </div>
        <h4>What type of investor are you?</h4>
        <h5>Select the type of investor you are below.</h5>
        <div class="dots">
          <label>
            <input type="radio" name="investor" />
            <span>Individual</span>
            <span class="dots-info">
              <small class="info">i</small>
              <span class="text">
                I am a natural person investing on my own behalf as a sole
                owner, joint tenant, or tenant in common.
              </span>
            </span>
          </label>
          <label>
            <input type="radio" name="investor" />
            <span>Business</span>
            <span class="dots-info">
              <small class="info">i</small>
              <span class="text"
                >I am a natural person investing on my own behalf as a sole
                owner, joint tenant, or tenant in common.</span
              >
            </span>
          </label>
          <label>
            <input type="radio" name="investor" />
            <span>IRA</span>
            <span class="dots-info">
              <small class="info">i</small>
              <span class="text"
                >I am a natural person investing on my own behalf as a sole
                owner, joint tenant, or tenant in common.</span
              >
            </span>
          </label>
          <label>
            <input type="radio" name="investor" />
            <span>Trust</span>
            <span class="dots-info">
              <small class="info">i</small>
              <span class="text"
                >I am a natural person investing on my own behalf as a sole
                owner, joint tenant, or tenant in common.</span
              >
            </span>
          </label>
        </div>
        <label class="checkbox">
          <input type="checkbox" name="terms" /> I agree to the terms and
          receiving notifications from iintoo.
          <a
            href="https://edu.habsida.com/student/courses/bdc8bace-2497-4eea-8fa8-30e6a8a0aa75/lesson/3e4dce7b-4a25-499d-b754-3023f00154c3"
            target="_blank"
            >View full terms</a
          >
        </label>
        <button class="account">Create account</button>
      </div>
    </div>
  </body>
</html>
